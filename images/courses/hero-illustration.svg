<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="h-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a5e"/>
      <stop offset="1" stop-color="#120b2e"/>
    </linearGradient>
    <linearGradient id="h-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6dff"/>
      <stop offset="1" stop-color="#4b2fd0"/>
    </linearGradient>
    <linearGradient id="h-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7457ff"/>
      <stop offset="1" stop-color="#3a22a8"/>
    </linearGradient>
    <linearGradient id="h-book-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d4bff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <linearGradient id="h-book-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5233e6"/>
      <stop offset="1" stop-color="#7d5cff"/>
    </linearGradient>
    <linearGradient id="h-code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff00c7" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7b61ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- brilho no chão -->
  <ellipse cx="260" cy="262" rx="230" ry="26" fill="url(#h-glow)"/>
  <ellipse cx="260" cy="262" rx="190" ry="6" fill="#ff4fd8" opacity="0.55" filter="url(#h-soft)"/>

  <!-- laptop -->
  <g transform="translate(70 40) rotate(-6 150 110)">
    <rect x="40" y="10" width="230" height="160" rx="14" fill="url(#h-frame)"/>
    <rect x="52" y="22" width="206" height="136" rx="8" fill="url(#h-screen)"/>
    <path d="M128 70 L100 92 L128 114" stroke="url(#h-code)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M182 70 L210 92 L182 114" stroke="url(#h-code)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166 62 L144 122" stroke="url(#h-code)" stroke-width="10" stroke-linecap="round"/>
    <path d="M20 172 H290 L272 196 H38 Z" fill="url(#h-base)"/>
    <rect x="130" y="176" width="50" height="5" rx="2.5" fill="#2a1a5e"/>
  </g>

  <!-- pilha de livros -->
  <g transform="translate(300 150)">
    <rect x="0" y="62" width="190" height="40" rx="8" fill="url(#h-book-b)"/>
    <rect x="12" y="70" width="166" height="24" rx="4" fill="#ece8ff" opacity="0.9"/>
    <rect x="6" y="18" width="176" height="42" rx="8" fill="url(#h-book-a)"/>
    <rect x="18" y="26" width="152" height="26" rx="4" fill="#f3f0ff" opacity="0.92"/>
    <rect x="0" y="18" width="16" height="42" rx="6" fill="#4b2fd0"/>
    <rect x="0" y="62" width="16" height="40" rx="6" fill="#3a22a8"/>
  </g>

  <!-- capelo -->
  <g transform="translate(330 20)">
    <path d="M10 46 L90 14 L170 46 L90 78 Z" fill="#3a22a8"/>
    <path d="M10 42 L90 10 L170 42 L90 74 Z" fill="url(#h-frame)"/>
    <path d="M46 58 V96 C46 110 134 110 134 96 V58 L90 76 Z" fill="#2a1a5e"/>
    <path d="M150 50 V94" stroke="#ff4fd8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="100" r="8" fill="#ff4fd8"/>
    <circle cx="90" cy="42" r="6" fill="#b9a6ff"/>
  </g>
</svg>
