<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="ph-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a5e"/>
      <stop offset="1" stop-color="#120b2e"/>
    </linearGradient>
    <linearGradient id="ph-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6dff"/>
      <stop offset="1" stop-color="#4b2fd0"/>
    </linearGradient>
    <linearGradient id="ph-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7457ff"/>
      <stop offset="1" stop-color="#3a22a8"/>
    </linearGradient>
    <linearGradient id="ph-code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="ph-layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#5a3ce6"/>
    </linearGradient>
    <linearGradient id="ph-layer-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5233e6"/>
      <stop offset="1" stop-color="#2b1880"/>
    </linearGradient>
    <radialGradient id="ph-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff00c7" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7b61ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="250" cy="250" rx="230" ry="38" fill="url(#ph-glow)"/>

  <!-- Laptop -->
  <g transform="translate(40 40) rotate(-6 150 110)">
    <rect x="30" y="20" width="250" height="160" rx="14" fill="url(#ph-frame)"/>
    <rect x="42" y="32" width="226" height="136" rx="8" fill="url(#ph-screen)"/>
    <path d="M130 82 108 100l22 18M180 82l22 18-22 18M163 76l-16 48" stroke="url(#ph-code)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 186h290l-22 22H32z" fill="url(#ph-base)"/>
    <rect x="128" y="190" width="54" height="6" rx="3" fill="#2a1a5e"/>
  </g>

  <!-- Diagrama de nós -->
  <g transform="translate(360 20)">
    <rect x="0" y="0" width="120" height="96" rx="14" fill="#1a1040" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="44" y="14" width="32" height="18" rx="4" fill="#c4b5fd"/>
    <rect x="16" y="62" width="32" height="18" rx="4" fill="#9b7bff"/>
    <rect x="72" y="62" width="32" height="18" rx="4" fill="#ff4fd8"/>
    <path d="M60 32v14M32 62V46h56v16" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M420 116v20" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Camadas -->
  <g transform="translate(360 140)">
    <path d="M60 0 120 26 60 52 0 26z" fill="url(#ph-layer)"/>
    <path d="M0 26v12l60 26V52zM120 26v12L60 64V52z" fill="url(#ph-layer-side)"/>
    <path d="M60 30 120 56 60 82 0 56z" fill="url(#ph-layer)" opacity="0.85"/>
    <path d="M0 56v12l60 26V82zM120 56v12L60 94V82z" fill="url(#ph-layer-side)"/>
    <path d="M60 18 86 29 60 40 34 29z" fill="#ff4fd8" opacity="0.8"/>
  </g>
</svg>
