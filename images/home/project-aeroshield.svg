<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1240"/>
      <stop offset="1" stop-color="#0a0618"/>
    </linearGradient>
    <linearGradient id="p-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a48bff"/>
      <stop offset="1" stop-color="#6a4cff"/>
    </linearGradient>
    <linearGradient id="p-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3de0"/>
      <stop offset="1" stop-color="#2e1c8c"/>
    </linearGradient>
    <linearGradient id="p-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4128b8"/>
      <stop offset="1" stop-color="#1f1266"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff00c7" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#7b61ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="240" fill="url(#p-bg)"/>
  <ellipse cx="160" cy="140" rx="150" ry="95" fill="url(#p-glow)"/>

  <!-- grade de fundo -->
  <g stroke="#7b61ff" stroke-opacity="0.14">
    <path d="M0 60h320M0 120h320M0 180h320M80 0v240M160 0v240M240 0v240"/>
  </g>

  <!-- camada base -->
  <path d="M160 150 250 172 160 196 70 172Z" fill="url(#p-top)" opacity="0.55"/>
  <path d="M70 172v10l90 24v-10Z" fill="url(#p-left)" opacity="0.7"/>
  <path d="M250 172v10l-90 24v-10Z" fill="url(#p-right)" opacity="0.7"/>

  <!-- camada do meio: 4 blocos -->
  <g>
    <path d="M118 140 150 148 118 156 86 148Z" fill="url(#p-top)"/>
    <path d="M86 148v12l32 8v-12Z" fill="url(#p-left)"/>
    <path d="M150 148v12l-32 8v-12Z" fill="url(#p-right)"/>

    <path d="M202 140 234 148 202 156 170 148Z" fill="url(#p-top)"/>
    <path d="M170 148v12l32 8v-12Z" fill="url(#p-left)"/>
    <path d="M234 148v12l-32 8v-12Z" fill="url(#p-right)"/>

    <path d="M160 128 192 136 160 144 128 136Z" fill="url(#p-top)"/>
    <path d="M128 136v12l32 8v-12Z" fill="url(#p-left)"/>
    <path d="M192 136v12l-32 8v-12Z" fill="url(#p-right)"/>

    <path d="M160 152 192 160 160 168 128 160Z" fill="url(#p-top)"/>
    <path d="M128 160v12l32 8v-12Z" fill="url(#p-left)"/>
    <path d="M192 160v12l-32 8v-12Z" fill="url(#p-right)"/>
  </g>

  <!-- camada superior -->
  <path d="M160 94 200 104 160 114 120 104Z" fill="url(#p-top)"/>
  <path d="M120 104v16l40 10v-16Z" fill="url(#p-left)"/>
  <path d="M200 104v16l-40 10v-16Z" fill="url(#p-right)"/>

  <!-- núcleo de IA -->
  <path d="M160 62 176 66 160 70 144 66Z" fill="#ffd6f5"/>
  <path d="M144 66v10l16 4V70Z" fill="#ff4fd8"/>
  <path d="M176 66v10l-16 4V70Z" fill="#c21aa0"/>
  <path d="M160 80v14" stroke="#ff4fd8" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- pontos de luz -->
  <g fill="#ffffff">
    <circle cx="160" cy="104" r="2.2"/>
    <circle cx="118" cy="148" r="1.6"/>
    <circle cx="202" cy="148" r="1.6"/>
    <circle cx="160" cy="160" r="1.6"/>
  </g>
  <g fill="#ff4fd8" opacity="0.8">
    <circle cx="60" cy="54" r="2"/>
    <circle cx="268" cy="80" r="1.6"/>
    <circle cx="250" cy="40" r="1.2"/>
    <circle cx="46" cy="120" r="1.2"/>
  </g>
</svg>
