<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" fill="none">
  <defs>
    <linearGradient id="nl-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="nl-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="nl-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="nl-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="nl-bell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff00c7"/>
    </linearGradient>
    <radialGradient id="nl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nl-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- brilho atrás e abaixo do envelope -->
  <ellipse cx="108" cy="182" rx="96" ry="14" fill="url(#nl-glow)"/>
  <rect x="34" y="96" width="148" height="80" rx="10" fill="#7b61ff" opacity="0.35" filter="url(#nl-blur)"/>

  <!-- raios de notificação -->
  <path d="M60 26l7 11M80 16v13M100 26l-7 11" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>

  <!-- fundo do envelope com a aba aberta -->
  <path d="M30 98L108 48l78 50v72a8 8 0 0 1-8 8H38a8 8 0 0 1-8-8z" fill="url(#nl-back)" stroke="url(#nl-edge)" stroke-width="2" stroke-linejoin="round"/>

  <!-- documento com </> -->
  <rect x="54" y="42" width="108" height="112" rx="9" fill="url(#nl-paper)"/>
  <rect x="68" y="56" width="42" height="30" rx="6" fill="#4338ca"/>
  <path d="M83 64.5l-6.5 6.5 6.5 6.5M95 64.5l6.5 6.5-6.5 6.5M91.5 62l-5 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="96" width="80" height="6" rx="3" fill="#7b61ff" opacity="0.8"/>
  <rect x="68" y="108" width="66" height="6" rx="3" fill="#7b61ff" opacity="0.6"/>
  <rect x="68" y="120" width="72" height="6" rx="3" fill="#7b61ff" opacity="0.45"/>

  <!-- frente do envelope -->
  <path d="M30 104l78 46 78-46v66a8 8 0 0 1-8 8H38a8 8 0 0 1-8-8z" fill="url(#nl-front)" opacity="0.94"/>
  <path d="M33 175l60-42M183 175l-60-42" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 104l78 46 78-46" stroke="url(#nl-edge)" stroke-width="2" stroke-linejoin="round"/>

  <!-- selo do sino -->
  <circle cx="164" cy="44" r="26" fill="url(#nl-bell)"/>
  <circle cx="164" cy="44" r="25" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M154 51h20l-3-4v-7a7 7 0 0 0-14 0v7z" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M161 55a3 3 0 0 0 6 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M164 30v3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
</svg>
